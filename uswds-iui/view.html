<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Micro form</title>
  <style>
    /* USWDS_COMPONENT_STYLES: populated from the pinned local package by server.js. */
    :root { font: 16px Arial, sans-serif; }
    body { margin: 0; padding: .75rem; background: #fff; color: #1b1b1b; }
    main { max-width: 28rem; }
    h2 { margin: 0; }
    .usa-form-group { margin-top: 1rem; }
    .usa-label { margin-top: 0; }
    .buttons { display: flex; flex-wrap: wrap; gap: .5rem; }
    .buttons .usa-button { margin: 0; width: auto; }
    #status { min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <h2>Micro form</h2>
    <div class="usa-form-group">
      <label class="usa-label" for="task">Task name</label>
      <input class="usa-input" id="task" type="text" maxlength="80" autocomplete="off" placeholder="Type a task name">
    </div>
    <p id="priority-label" class="usa-label">Priority</p>
    <div class="buttons" role="group" aria-labelledby="priority-label">
      <button class="usa-button usa-button--outline" type="button" data-priority="Low" aria-pressed="false">Low</button>
      <button class="usa-button" type="button" data-priority="Medium" aria-pressed="true">Medium</button>
      <button class="usa-button usa-button--outline" type="button" data-priority="High" aria-pressed="false">High</button>
    </div>
    <p id="status" role="status" aria-live="polite">If you can see this form, inline rendering works.</p>
  </main>
  <script>
    // Goose's embedded view needs a handshake and size notifications to show
    // content below the first few lines instead of clipping the buttons.
    let requestId = 0;
    let initialized = false;

    function notify(method, params) {
      window.parent.postMessage({ jsonrpc: '2.0', method, params }, '*');
    }

    function reportSize() {
      if (!initialized) return;
      // Goose has a nested sandbox frame; reserve extra room so the last row
      // is not clipped by differences between its viewport and our content.
      const contentHeight = document.querySelector('main').getBoundingClientRect().height;
      notify('ui/notifications/size-changed', {
        width: document.documentElement.scrollWidth,
        height: Math.ceil(Math.max(400, contentHeight + 64, document.body.scrollHeight + 64)),
      });
    }

    function initialize() {
      const id = ++requestId;
      window.addEventListener('message', function onInitialize(event) {
        if (event.source !== window.parent || event.data?.id !== id) return;
        window.removeEventListener('message', onInitialize);
        if (event.data.error) {
          document.getElementById('status').textContent = 'Host could not initialize the inline form.';
          return;
        }
        initialized = true;
        notify('ui/notifications/initialized', {});
        reportSize();
        new ResizeObserver(reportSize).observe(document.body);
      });
      window.parent.postMessage({ jsonrpc: '2.0', id, method: 'ui/initialize', params: {} }, '*');
    }

    document.querySelectorAll('[data-priority]').forEach((button) => {
      button.addEventListener('click', () => {
        document.querySelectorAll('[data-priority]').forEach((item) => {
          item.setAttribute('aria-pressed', String(item === button));
          item.classList.toggle('usa-button--outline', item !== button);
        });
        document.getElementById('status').textContent = `${button.dataset.priority} selected. Inline buttons work.`;
        reportSize();
      });
    });
    initialize();
  </script>
</body>
</html>
