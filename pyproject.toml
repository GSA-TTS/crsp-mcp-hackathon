[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "regulatory-mcp"
version = "0.1.0"
description = "Evidence-linked regulatory research and economic analysis MCP suite"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastmcp==4.1.4",
  "pydantic-settings==2.16.2",
  "pydantic-monty==1.4.0",
  "pydantic==2.14.2",
  "httpx2==2.16.0",
  "defusedxml==0.7.1",
  "boto3==1.43.125",
  "uvicorn==0.54.0",
  "starlette==1.10.0",
  "pypdf==7.0.0",
]

[dependency-groups]
dev = [
  "bandit==1.9.4",
  "detect-secrets==1.5.0",
  "hatchling==1.33.0",
  "mypy==2.4.1",
  "pip-audit==2.10.1",
  "pytest==9.2.0",
  "ruff==0.17.3",
  "PyYAML==6.0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/regulatory_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["defusedxml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".cache"]
